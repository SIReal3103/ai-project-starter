name: Verify portable starter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check repository portability
        run: python scripts/check_repository.py
      - name: Verify project generator
        run: python -m unittest discover -s tests -v
      - name: Verify evaluation runner
        run: python tools/evals/main.py self-test
      - name: Run offline example
        run: python tools/evals/main.py demo --out artifacts/demo --frameworks off
      - name: Render report
        run: python tools/evals/report.py --input artifacts/demo/results.json --output artifacts/report.html
  frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [ragas, deepeval]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked optional framework
        run: sh tools/evals/setup-tools.sh "${{ matrix.framework }}"
      - name: Run framework against synthetic responses
        run: python tools/evals/main.py demo --out artifacts/framework --frameworks auto
      - name: Confirm framework ran without errors
        env:
          CHECK_FRAMEWORK: ${{ matrix.framework }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = os.environ['CHECK_FRAMEWORK']
          result = json.loads(Path(f'artifacts/framework/{name}.json').read_text(encoding='utf-8'))
          assert not result['errors'], result['errors']
          assert any(row['status'] == 'scored' for row in result['results'])
          print(f'{name}: metrics were scored successfully')
          PY
